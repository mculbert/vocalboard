loaders:
  - type: python
    search_path: [python]
    packages:
      - vocalboard_sidecar

renderer:
  type: mkdocs
  output_directory: docs/content/internals/api/python
  markdown:
    descriptive_class_title: false
    descriptive_module_title: false
    add_full_prefix: false
    header_level_by_type:
      Module: 1
      Class: 2
      Method: 3
      Function: 3
      Variable: 3
