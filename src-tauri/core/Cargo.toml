[package]
name = "core"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "vb_core"

[lints]
workspace = true

[features]
# Opt-in: tests that spawn the real Python sidecar (`-m vocalboard_sidecar`).
# Off by default so a bare `cargo test --workspace` needs no Python on PATH.
sidecar-integration = []

[dependencies]
proto = { path = "../proto" }

anyhow = "1"
blake3 = "1"
postcard = { version = "1", default-features = false, features = ["use-std"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "sync", "time", "rt"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
