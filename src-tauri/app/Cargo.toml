[package]
name = "app"
version = "0.1.0"
edition = "2021"
publish = false

[lints]
workspace = true

[dependencies]
vb_core = { path = "../core", package = "core" }
proto = { path = "../proto" }

anyhow = "1"
serde_json = "1"

tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"
tokio = { version = "1", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

[dev-dependencies]
# Enable core's cross-crate `test-support` helpers (synthetic `ProjectState` for the
# handler tests) only for this crate's tests — never in the production dependency above.
vb_core = { path = "../core", package = "core", features = ["test-support"] }
tempfile = "3"

[build-dependencies]
tauri-build = { version = "2", features = [] }
