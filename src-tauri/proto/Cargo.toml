[package]
name = "proto"
version = "0.1.0"
edition = "2021"
publish = false

[lints]
workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = { version = "10", features = ["serde-compat"], optional = true }
anyhow = { version = "1", optional = true }

[features]
ts-export = ["dep:ts-rs", "dep:anyhow"]

[[bin]]
name = "gen_bindings"
path = "src/bin/gen_bindings.rs"
required-features = ["ts-export"]
