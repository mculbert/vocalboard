[project]
name = "vocalboard-sidecar"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["structlog>=25.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vocalboard_sidecar"]

[project.optional-dependencies]
docs = ["pydoc-markdown>=4.8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
